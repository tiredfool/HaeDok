<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>해독 — First Night</title>
  <style>
    :root{--bg:#0d1117;--panel:#171d25;--soft:#202834;--line:#33404c;--txt:#eef3f6;--muted:#9eabb5;--accent:#b8a6d7}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(#111823,#0d1117);color:var(--txt);font-family:system-ui,"Noto Sans KR",sans-serif}
    button{font:inherit;color:inherit}.screen{display:none;min-height:100vh}.screen.on{display:block}
    .title{place-items:center;padding:24px}.screen.title.on{display:grid}.card{width:min(680px,100%);border:1px solid var(--line);border-radius:24px;padding:38px;background:rgba(23,29,37,.94)}
    .eyebrow{font-size:12px;letter-spacing:.16em;color:var(--muted);margin:0 0 8px}.card h1{font-size:72px;margin:0 0 10px}.muted{color:var(--muted);line-height:1.7}
    .btn{border:1px solid var(--line);background:var(--soft);border-radius:12px;min-height:44px;padding:9px 13px;cursor:pointer}.btn:hover{border-color:var(--accent)}.btn:disabled{opacity:.4;cursor:not-allowed}.primary{background:#2b2438;border-color:#766491}
    .row{display:flex;gap:8px;flex-wrap:wrap}.game{max-width:1500px;margin:auto;padding:18px 22px 28px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    .chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 9px}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:14px;align-items:start}.scene{position:relative;min-height:680px;aspect-ratio:16/9;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:linear-gradient(#202a3a,#3b4752 62%,#182028);box-shadow:0 18px 55px rgba(0,0,0,.28)}
    .moon{position:absolute;width:75px;height:75px;border-radius:50%;right:8%;top:8%;background:#e7eaec;opacity:.7}.ground{position:absolute;left:-8%;right:-8%;bottom:-70px;height:230px;border-radius:50% 50% 0 0;background:#172027}
    .house{position:absolute;left:10%;bottom:105px;width:180px;height:150px;background:#34404a}.char{position:absolute;right:18%;bottom:90px;width:110px;height:240px;border-radius:50% 50% 15px 15px;background:linear-gradient(#d7d0c7 0 32%,#717c86 32%)}.portrait-fallback{display:none}.hwayeong-sprite{position:absolute;left:3%;right:auto;bottom:0;height:92%;max-width:48%;object-fit:contain;object-position:bottom left;z-index:4;pointer-events:none;display:none;filter:drop-shadow(0 12px 22px rgba(0,0,0,.38))}.hwayeong-sprite.visible{display:block}
    .room{position:absolute;inset:12% 8% 18%;background:#303945;border:1px solid #495663;border-radius:10px}.painting{position:absolute;left:18%;top:20%;width:180px;height:120px;border:7px solid #5c5146;background:linear-gradient(145deg,#627681,#1d262d)}
    .barrier{position:absolute;right:5%;top:15%;width:33%;height:70%;border-left:2px solid rgba(230,240,250,.55);border-radius:50%}.hot{z-index:5;position:absolute;min-width:48px;min-height:48px;border-radius:50%;border:1px dashed #d8dde2;background:#11182099;color:#fff;cursor:pointer}.hot.done{opacity:.45;border-style:solid}
    .dialog{position:absolute;left:22px;right:22px;bottom:18px;z-index:10;border:1px solid rgba(154,170,183,.5);border-radius:17px;background:rgba(12,17,23,.9);backdrop-filter:blur(8px);padding:17px 20px 18px;cursor:pointer;user-select:none;box-shadow:0 12px 34px rgba(0,0,0,.38)}.speaker{font-size:13px;font-weight:800;color:#d8c9f1;margin-bottom:7px;letter-spacing:.04em}.line{min-height:64px;line-height:1.75;font-size:16px;padding-right:8px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:11px}.choices:empty{display:none}.choices .btn{width:100%;min-height:52px;text-align:left;padding:11px 14px;background:#1b222c;border-color:#3b4855}.choices .btn:hover{background:#252e3a;border-color:#8c78aa}.choices .btn.primary{background:#2e263b;border-color:#766491}
    .side,.archive{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:12px}.side h3{font-size:13px}.place{width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 2px;cursor:pointer}.place:first-of-type{border-top:0}.place:disabled{opacity:.35}.place.on{color:#d5c4f0;font-weight:800}
    .archive{margin-top:10px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tab{border:1px solid var(--line);border-radius:999px;background:transparent;padding:6px 10px;cursor:pointer}.tab.on{border-color:var(--accent);background:#2b2438}
    .item{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 0;cursor:pointer}.item small{display:block;color:var(--muted);margin-top:4px}.detail{border:1px solid var(--line);border-radius:12px;padding:12px}.note{margin-top:9px;font-style:italic;color:#cfd6dc}.cg{height:180px;border-radius:12px;background:linear-gradient(145deg,#5c6977,#222a34);display:flex;align-items:flex-end;padding:14px;margin-top:10px}
    .hide{display:none!important}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{order:2}.scene{min-height:520px;aspect-ratio:auto}.hwayeong-sprite{left:-1%;right:auto;height:90%;max-width:58%}}@media(max-width:700px){.game{padding:10px}.scene{min-height:460px;border-radius:16px}.card h1{font-size:54px}.dialog{left:10px;right:10px;bottom:10px;padding:13px 14px}.line{font-size:15px;min-height:70px}.choices{grid-template-columns:1fr}.hwayeong-sprite{left:-10%;right:auto;height:86%;max-width:74%}}
  </style>
</head>
<body>
  <section id="title" class="screen title on"><div class="card"><p class="eyebrow">MYSTERY ROMANCE VISUAL NOVEL</p><h1>해독</h1><p class="muted">상처를 가진 사람들이 머무는 꿈속 마을.<br>말과 흔적을 따라 한 사람의 기억을 해독한다.</p><div class="row"><button id="newBtn" type="button" class="btn primary">새 게임</button><button id="continueBtn" type="button" class="btn">이어하기</button></div><p class="muted">Prototype · First Night</p></div></section>
  <section id="game" class="screen game">
    <div class="top"><div><p class="eyebrow">FIRST NIGHT</p><h2 id="locTitle">꿈속 광장</h2></div><div class="chips"><span id="traceStat" class="chip">흔적 0</span><span id="memoryStat" class="chip">기억 0</span><span id="trustStat" class="chip">화영 · 낯섦</span></div></div>
    <div class="layout"><main><div id="scene" class="scene"><div class="moon"></div><div id="art"></div><img id="hwayeongSprite" class="hwayeong-sprite" alt="이화영"><div id="hots"></div><div class="dialog"><div id="speaker" class="speaker">—</div><div id="text" class="line">게임을 시작해 주세요.</div></div></div><div id="choices" class="choices"></div><div class="row" style="margin-top:11px"><button id="talkBtn" type="button" class="btn">화영과 대화</button><button id="recordBtn" type="button" class="btn">기록</button><button id="saveBtn" type="button" class="btn">저장</button><button id="titleBtn" type="button" class="btn">타이틀</button></div><div id="archive" class="archive hide"></div></main><aside class="side"><h3>꿈속 마을</h3><div id="places"></div><h3>현재 감각</h3><p id="hint" class="muted">화영과 먼저 이야기해보자.</p></aside></div>
  </section>
  <script src="./game.js?v=9"></script>
</body>
</html>
